    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
rules:
  # rollout-restart and scale
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  # cordon, uncordon, drain
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
