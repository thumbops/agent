apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: thumbops-agent-actions
  labels:
    helm.sh/chart: thumbops-agent-0.1.0
    app.kubernetes.io/name: thumbops-agent
