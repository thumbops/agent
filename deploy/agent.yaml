# ThumbOps agent installation without Helm.
#
# GENERATED from charts/thumbops-agent by hack/gen-manifest.sh: do not edit,
# change the chart and run the script again.
#
#   kubectl apply -f deploy/agent.yaml
#   kubectl -n thumbops create secret generic thumbops-bootstrap --from-literal=token=<SINGLE-USE TOKEN>
#
# ClusterRoles: thumbops-agent-base (always needed: kube-system UID at
# registration, node counts in the heartbeat), thumbops-agent-actions (only
# what the five actions need), thumbops-agent-status (read-only, for the
# dashboard's cluster status). The Role thumbops-agent-identity lets the agent
# read and update only the Secret holding its key and certificate.
#
# To register again (cluster revoked, certificate expired), put a new
# single-use token in thumbops-bootstrap and restart the agent: a token
# different from the one used for the saved identity triggers a new
# registration. For other options (dashboard only, no actions, backend CA,
# metrics Service) install with Helm: see charts/thumbops-agent/README.md.
apiVersion: v1
kind: Namespace
metadata:
  name: thumbops
---
# Source: thumbops-agent/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: thumbops-agent
  namespace: thumbops
  labels:
    helm.sh/chart: thumbops-agent-0.1.0
    app.kubernetes.io/name: thumbops-agent
    app.kubernetes.io/instance: thumbops-agent
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: thumbops-agent/templates/identity-secret.yaml
# Agent identity: private key and certificate. Created empty and filled by
# the agent, which has no permission to create Secrets. Upgrades never touch
# its data and uninstall keeps it: a new install with the same release name
# in the same namespace adopts it and the agent keeps its identity.
apiVersion: v1
kind: Secret
metadata:
  name: thumbops-agent-identity
  namespace: thumbops
  labels:
    helm.sh/chart: thumbops-agent-0.1.0
    app.kubernetes.io/name: thumbops-agent
    app.kubernetes.io/instance: thumbops-agent
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    helm.sh/resource-policy: keep
type: Opaque

---
# Source: thumbops-agent/templates/policy-configmap.yaml
# Local policy: managed by the cluster team, not by the backend.
# An action outside the policy is rejected even if approved in the app.
apiVersion: v1
kind: ConfigMap
metadata:
  name: thumbops-agent-policy
  namespace: thumbops
  labels:
    helm.sh/chart: thumbops-agent-0.1.0
    app.kubernetes.io/name: thumbops-agent
    app.kubernetes.io/instance: thumbops-agent
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
data:
  policy.json: |
    {
      "allow_control_plane_nodes": false,
      "allow_delete_emptydir_data": false,
      "allowed_actions": [
        "rollout-restart",
        "scale",
        "cordon",
        "uncordon",
        "drain"
      ],
      "denied_namespaces": [
        "kube-system",
        "thumbops"
      ],
      "max_replicas": 20,
      "status": {
        "exclude_namespaces": []
      }
    }

---
# Source: thumbops-agent/templates/rbac.yaml
# Always needed: cluster identification at registration (kube-system UID)
# and the node counts in the heartbeat.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: thumbops-agent-base
  labels:
    helm.sh/chart: thumbops-agent-0.1.0
    app.kubernetes.io/name: thumbops-agent
    app.kubernetes.io/instance: thumbops-agent
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["kube-system"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]

---
# Source: thumbops-agent/templates/rbac.yaml
