---
# Source: thumbops-agent/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thumbops-agent
  namespace: thumbops
  labels:
    helm.sh/chart: thumbops-agent-0.1.0
    app.kubernetes.io/name: thumbops-agent
    app.kubernetes.io/instance: thumbops-agent
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1 # a single agent per cluster
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: thumbops-agent
      app.kubernetes.io/instance: thumbops-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thumbops-agent
        app.kubernetes.io/instance: thumbops-agent
      annotations:
        # The agent reads the policy at startup: restart it when it changes.
        checksum/policy: 1493ecf5910c2e25406401f225fbd31d88b5fe1f1ccd48b1183d175b4ce4ddbd
        prometheus.io/path: /metrics
        prometheus.io/port: "9090"
        prometheus.io/scrape: "true"
    spec:
      serviceAccountName: thumbops-agent
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: "ghcr.io/thumbops/agent:0.1.0"
          imagePullPolicy: IfNotPresent
          args:
            - --backend-url=https://agent.thumbops.mobiletechnologies.cloud
            - --policy-file=/etc/thumbops/policy/policy.json
            - --bootstrap-token-file=/etc/thumbops/bootstrap/token
            - --state-secret=thumbops-agent-identity
            - --http-addr=:9090
            - --log-level=info
          ports:
            - name: http
              containerPort: 9090
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: policy
              mountPath: /etc/thumbops/policy
              readOnly: true
            - name: bootstrap
              mountPath: /etc/thumbops/bootstrap
              readOnly: true
      volumes:
        - name: policy
          configMap:
            name: thumbops-agent-policy
        - name: bootstrap
          secret:
            secretName: thumbops-bootstrap
            optional: true # needed only to register
