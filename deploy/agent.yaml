# ThumbOps agent installation (prototype).
#
#   kubectl apply -f deploy/agent.yaml
#   kubectl -n thumbops create secret generic thumbops-bootstrap --from-literal=token=<SINGLE-USE TOKEN>
#
# Two ClusterRoles: thumbops-agent-actions grants only what the five actions
# need; thumbops-agent-status is read-only, for the dashboard's cluster status.
# The Role thumbops-agent-identity lets the agent read and update only the
# Secret holding its key and certificate.
#
# To register again (cluster revoked, certificate expired), put a new
# single-use token in thumbops-bootstrap and restart the agent: a token
# different from the one used for the saved identity triggers a new
# registration.
# To install the agent for the dashboard only, drop the actions ClusterRole
# and binding and leave "allowed_actions" empty in the policy; to install it
# without the dashboard, drop the status ones and run it with --status=false.
apiVersion: v1
kind: Namespace
metadata:
  name: thumbops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: thumbops-agent
  namespace: thumbops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: thumbops-agent-actions
rules:
  # rollout-restart and scale
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  # cordon, uncordon, drain; reading nodes for the heartbeat
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
  # drain: listing the pods on the node and eviction (honors PodDisruptionBudgets)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  # cluster identification at registration (kube-system UID)
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["kube-system"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: thumbops-agent-actions
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: thumbops-agent-actions
subjects:
  - kind: ServiceAccount
    name: thumbops-agent
    namespace: thumbops
---
# Agent identity: private key and certificate. Created empty here and filled
# by the agent, so it needs no permission to create Secrets. Applying this
# manifest again does not erase what the agent wrote.
apiVersion: v1
kind: Secret
metadata:
  name: thumbops-agent-identity
  namespace: thumbops
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: thumbops-agent-identity
  namespace: thumbops
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["thumbops-agent-identity"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: thumbops-agent-identity
  namespace: thumbops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: thumbops-agent-identity
subjects:
  - kind: ServiceAccount
    name: thumbops-agent
    namespace: thumbops
---
# Cluster status for the dashboard: read-only, watched through informers.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: thumbops-agent-status
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: thumbops-agent-status
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: thumbops-agent-status
subjects:
  - kind: ServiceAccount
    name: thumbops-agent
    namespace: thumbops
---
# Local policy: managed by the cluster team, not by the backend.
# An action outside the policy is rejected even if approved in the app.
apiVersion: v1
kind: ConfigMap
metadata:
  name: thumbops-policy
  namespace: thumbops
data:
  policy.json: |
    {
      "allowed_actions": ["rollout-restart", "scale", "cordon", "uncordon", "drain"],
      "denied_namespaces": ["kube-system", "thumbops"],
      "max_replicas": 20,
      "allow_delete_emptydir_data": false,
      "allow_control_plane_nodes": false,
      "status": { "exclude_namespaces": [] }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thumbops-agent
  namespace: thumbops
spec:
  replicas: 1 # a single agent per cluster
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: thumbops-agent
  template:
    metadata:
      labels:
        app: thumbops-agent
    spec:
      serviceAccountName: thumbops-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ghcr.io/thumbops/agent:0.1.0 # replace with your own image
          args:
            - --backend-url=https://agent.thumbops.mobiletechnologies.cloud
            - --policy-file=/etc/thumbops/policy/policy.json
            - --bootstrap-token-file=/etc/thumbops/bootstrap/token
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: policy
              mountPath: /etc/thumbops/policy
              readOnly: true
            - name: bootstrap
              mountPath: /etc/thumbops/bootstrap
              readOnly: true
      volumes:
        - name: policy
          configMap:
            name: thumbops-policy
        - name: bootstrap
          secret:
            secretName: thumbops-bootstrap
            optional: true # needed only to register
