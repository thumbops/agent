# ThumbOps agent installation (prototype).
#
#   kubectl apply -f deploy/agent.yaml
#   kubectl -n thumbops create secret generic thumbops-bootstrap --from-literal=token=<SINGLE-USE TOKEN>
#
# The ClusterRole grants only what the five actions need. To install the
# agent without write permissions, remove the "patch" and "create" verbs
# and leave "allowed_actions" empty in the policy.
apiVersion: v1
kind: Namespace
metadata:
  name: thumbops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: thumbops-agent
  namespace: thumbops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: thumbops-agent-actions
rules:
  # rollout-restart and scale
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  # cordon, uncordon, drain; reading nodes for the heartbeat
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
  # drain: listing the pods on the node and eviction (honors PodDisruptionBudgets)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  # cluster identification at registration (kube-system UID)
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["kube-system"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: thumbops-agent-actions
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: thumbops-agent-actions
subjects:
  - kind: ServiceAccount
    name: thumbops-agent
    namespace: thumbops
---
# Local policy: managed by the cluster team, not by the backend.
# An action outside the policy is rejected even if approved in the app.
apiVersion: v1
kind: ConfigMap
metadata:
  name: thumbops-policy
  namespace: thumbops
data:
  policy.json: |
    {
      "allowed_actions": ["rollout-restart", "scale", "cordon", "uncordon", "drain"],
      "denied_namespaces": ["kube-system", "thumbops"],
      "max_replicas": 20,
      "allow_delete_emptydir_data": false,
      "allow_control_plane_nodes": false
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thumbops-agent
  namespace: thumbops
spec:
  replicas: 1 # a single agent per cluster
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: thumbops-agent
  template:
    metadata:
      labels:
        app: thumbops-agent
    spec:
      serviceAccountName: thumbops-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ghcr.io/thumbops/agent:0.1.0 # replace with your own image
          args:
            - --backend-url=https://agent.thumbops.mobiletechnologies.cloud
            - --state-dir=/var/lib/thumbops
            - --policy-file=/etc/thumbops/policy/policy.json
            - --bootstrap-token-file=/etc/thumbops/bootstrap/token
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /var/lib/thumbops
            - name: policy
              mountPath: /etc/thumbops/policy
              readOnly: true
            - name: bootstrap
              mountPath: /etc/thumbops/bootstrap
              readOnly: true
      volumes:
        # Prototype: key and certificate on a PVC, so they survive restarts.
        # In production they will live in a Secret managed by the agent.
        - name: state
          persistentVolumeClaim:
            claimName: thumbops-agent-state
        - name: policy
          configMap:
            name: thumbops-policy
        - name: bootstrap
          secret:
            secretName: thumbops-bootstrap
            optional: true # no longer needed after registration
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: thumbops-agent-state
  namespace: thumbops
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Mi
