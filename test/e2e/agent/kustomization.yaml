# deploy/agent.yaml as it is (same RBAC, policy and security context), pointed
# at the in-cluster mock backend, with the locally built image and short
# intervals.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - agent.yaml # copied from deploy/ by run.sh
images:
  - name: ghcr.io/thumbops/agent
    newName: thumbops/agent
    newTag: e2e
patches:
  - target:
      kind: Deployment
      name: thumbops-agent
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/args/0
        value: --backend-url=https://agent.thumbops.mobiletechnologies.cloud
      - op: replace
        path: /spec/template/spec/containers/0/args/0
        value: --backend-url=https://mock-backend.thumbops-e2e.svc:8443
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --backend-ca-file=/etc/thumbops/backend-ca/ca.crt
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --heartbeat-interval=5s
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --status-interval=10s
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: { name: backend-ca, mountPath: /etc/thumbops/backend-ca, readOnly: true }
      - op: add
        path: /spec/template/spec/volumes/-
        value: { name: backend-ca, configMap: { name: thumbops-backend-ca } }
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { thumbops-e2e: infra }
