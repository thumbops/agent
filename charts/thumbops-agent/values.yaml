# Default values for the ThumbOps agent. See README.md for every value.

image:
  repository: ghcr.io/thumbops/agent
  # Empty = the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

backend:
  url: https://agent.thumbops.mobiletechnologies.cloud
  # PEM of the CA that signs the backend certificate; empty = system CAs.
  caBundle: ""

# Single-use bootstrap token, needed only for the first registration (or to
# register again). Set token, or existingSecret, not both.
bootstrap:
  token: ""
  existingSecret: ""
  key: token

identity:
  # Secret holding the agent's key and certificate. Created empty, kept on
  # uninstall (helm.sh/resource-policy: keep).
  secretName: thumbops-agent-identity

# Local policy (same fields as the agent's policy JSON). The release
# namespace is always added to denied_namespaces.
policy:
  allowed_actions: [rollout-restart, scale, cordon, uncordon, drain]
  denied_namespaces: [kube-system]
  max_replicas: 20
  allow_delete_emptydir_data: false
  allow_control_plane_nodes: false
  status:
    exclude_namespaces: []

rbac:
  # ClusterRole for the five actions.
  actions: true
  # Read-only ClusterRole for the cluster status; false also turns the status off.
  status: true

# Empty = agent defaults (60s).
heartbeatInterval: ""
statusInterval: ""
logLevel: info
extraArgs: []

http:
  port: 9090

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 30
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 5

metrics:
  service:
    enabled: false
  serviceMonitor:
    # Needs the Prometheus Operator CRDs; implies the Service.
    enabled: false
    interval: 30s
    labels: {}

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: /metrics
podLabels: {}

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
