{{- $name := include "thumbops-agent.bootstrapSecret" . }}
{{- if .Values.bootstrap.token }}
# Single-use bootstrap token, needed only to register.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thumbops-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.bootstrap.token | quote }}
{{- end }}
