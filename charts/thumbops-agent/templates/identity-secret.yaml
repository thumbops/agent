# Agent identity: private key and certificate. Created empty and filled by
# the agent, which has no permission to create Secrets. Upgrades never touch
# its data and uninstall keeps it: a new install with the same release name
# in the same namespace adopts it and the agent keeps its identity.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.identity.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thumbops-agent.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
